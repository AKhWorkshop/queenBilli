name = "game-rooms"
main = "src/index.js"
compatibility_date = "2025-06-01"

# One Durable Object per room, one per game for the public room list.
# SQLite-backed classes are the ones allowed on Cloudflare's free plan.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Account"

[[durable_objects.bindings]]
name = "CODES"
class_name = "Codes"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Account", "Codes"]

[vars]
# Who may connect. "*" = any site. For more safety put your sites, comma separated:
# ALLOWED_ORIGINS = "https://yourname.github.io,http://localhost:8000"
ALLOWED_ORIGINS = "*"

# Game files (public/<game>/) are served by this same Worker; any path that
# is not a file goes to src/index.js (rooms, accounts, saves).
[assets]
directory = "./public"
