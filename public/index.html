<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ألعابي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* the platform's own light look (separate from the games): paper ground, white cards, one accent the admin can change */
:root{--paper:#F4F2ED;--surface:#FFFFFF;--field:#F7F6F2;--line:#E3DFD6;--line2:#D6D1C6;--ink:#16161D;--mute:#5F5C68;--acc:#2446F5;--ok:#0F7B57;--danger:#C2362B;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg,var(--paper));color:var(--bgInk,var(--ink));font:15px/1.55 "Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100dvh}
[hidden]{display:none!important}
a{color:var(--acc)}
header{background:var(--surface);border-bottom:1px solid var(--line);color:var(--ink)}
.hwrap{max-width:1160px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;width:30px;height:30px}.logo i{background:var(--ink);border-radius:4px}.logo i:first-child{background:var(--acc)}.logo i:last-child{border-radius:50%}
#title{font-weight:700;font-size:22px;margin:0}
.grow{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.av{width:32px;height:32px;border-radius:50%;background:color-mix(in srgb,var(--acc) 16%,var(--surface));color:var(--acc);display:grid;place-items:center;font-weight:700;flex:none}
main{max-width:1160px;margin:0 auto;padding:32px 24px 64px}
h1,h2,h3{margin:0}
.card{color:var(--ink);background:var(--card,var(--surface));border:1px solid var(--line);border-radius:18px;padding:24px}
button,.btn{min-height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--acc);color:var(--accInk,#fff);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.out,.btn.out{background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
button.dark{background:var(--surface);color:var(--ink);border:1px solid var(--ink)}
button.danger{background:var(--surface);color:var(--danger);border:1px solid var(--line2)}
button.sm{min-height:38px;padding:0 14px;font-size:14px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
input,select{min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;width:100%}
input[type=color]{padding:3px;height:44px}
.mut{color:var(--mute);font-size:14px}
.err{color:var(--danger);font-size:13px;min-height:20px;margin:0}
.ok{color:var(--ok)}
.code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600;letter-spacing:6px;direction:ltr}
/* sign in */
#signBox{max-width:440px;margin:48px auto 0;padding:32px;display:flex;flex-direction:column;gap:16px}
#signBox h1{font-size:26px;font-weight:700}#signBox input{background:var(--field);min-height:46px;border-radius:12px}
#signBox button{min-height:48px;border-radius:12px}
/* games */
.secT{font-size:28px;font-weight:700;margin:0 0 16px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-bottom:32px}
.game{background:var(--card,var(--surface));border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.game .pic{position:relative;height:170px;background:var(--ink)}.game .pic img{width:100%;height:170px;object-fit:cover;object-position:center 25%;display:block}
.pill{position:absolute;top:12px;inset-inline-start:12px;display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#fff;color:var(--ok);font-size:12px;font-weight:600}.pill i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.game .gb{padding:18px;display:flex;align-items:center;gap:12px}.game .gb div{flex:1;min-width:0}.game b{display:block;font-size:19px}.game span{font-size:14px;color:var(--mute)}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.colMain{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:24px}
.colSide{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:24px}
/* rooms */
.roomGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}
.roomGrid>div{background:var(--field);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.roomGrid b{font-size:14px}
#rc{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:18px;letter-spacing:4px;text-align:center;text-transform:uppercase}
.pubT{margin:22px 0 10px;font-size:14px;font-weight:600;color:var(--mute)}
#pub{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
#pub:empty{display:none}
.pr{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface)}.pr+.pr{border-top:1px solid var(--line)}
.pr .av{width:36px;height:36px;background:var(--field);color:var(--ink);font-size:14px}.pr div{flex:1;min-width:0}.pr b{font-size:14px}.pr small{display:block;font-size:12px;color:var(--mute)}
.cnt{padding:2px 10px;border-radius:999px;background:#E9F5EF;color:var(--ok);font-size:12px;font-weight:600;direction:ltr}
.noPub{padding:12px 14px;color:var(--mute);font-size:14px;background:var(--surface)}
/* the room you are in */
#roomView{border:2px solid var(--acc)}
.rvTop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.rvTop>div{flex:1}
#rvCode{font-size:32px;line-height:1.2}
.icoBtn{width:40px;min-height:40px;padding:0;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.rvBody{display:flex;gap:20px;flex-wrap:wrap;margin-top:18px}
.rvPl{flex:1 1 200px;display:flex;flex-direction:column;gap:8px}.rvCh{flex:2 1 320px;min-width:0;display:flex;flex-direction:column;gap:8px}
.rvPl h3,.rvCh h3{font-size:13px;font-weight:600;color:var(--mute)}
.pl{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--field);border-radius:10px}.pl .av{width:30px;height:30px;font-size:13px}.pl.me .av{background:color-mix(in srgb,var(--acc) 16%,var(--surface))}.pl:not(.me) .av{background:var(--surface);color:var(--ink)}
.pl span:not(.av):not(.hostB){flex:1;font-size:14px;font-weight:600}.pl .av,.hostB{flex:none}.hostB{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--surface)}
#chat{height:170px;overflow:auto;background:var(--field);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
#chat .sys{align-self:center;font-size:12px;color:var(--mute);text-align:center}
#chat .bub{align-self:flex-start;max-width:80%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px}#chat .bub b{display:block;font-size:12px;color:var(--acc)}
#chat .bub.mine{align-self:flex-end;background:color-mix(in srgb,var(--acc) 14%,var(--surface));border-color:color-mix(in srgb,var(--acc) 30%,var(--surface))}
.sendRow{display:flex;gap:8px}.sendRow input{flex:1}
/* account */
.side h2{font-size:18px;font-weight:700}
#accBox{display:flex;flex-direction:column;gap:12px}#accBox input{background:var(--field)}
/* admin: dark panel */
#adminBox{background:#16161D;color:#F4F2ED;border:0;display:flex;flex-direction:column;gap:14px}
#adminBox label.f{color:#BEBAC6}#adminBox input{background:#22222B;border-color:#34343F;color:#F4F2ED}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#F4F2ED;color:#16161D}
.admTop{display:flex;align-items:center;justify-content:space-between}
.swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.swatches label{font-size:12px}
#adminBox h3{font-size:13px;font-weight:600;color:#BEBAC6;margin-top:4px}
.ge{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#22222B;border-radius:10px;padding:10px}
.ge input{min-height:38px;font-size:13px;background:#16161D}.ge label{display:flex;gap:6px;align-items:center;font-size:13px;color:#BEBAC6}.ge input[type=checkbox]{width:auto;min-height:0}
.ge button{background:transparent;border:1px solid #34343F;color:#F4F2ED;min-height:36px;font-size:13px}
.admBtns{display:flex;gap:8px}.admBtns #aAdd{background:transparent;border:1px dashed #5A5A66;color:#F4F2ED}.admBtns #aSave{flex:1;background:#F4F2ED;color:#16161D}
#adminBox .err{color:#FFB4A9}#adminBox .note{margin:0;font-size:12px;line-height:1.6;color:#BEBAC6}
@media (max-width:560px){.hwrap{padding:12px 16px}main{padding:24px 16px 48px}.card{padding:18px}#signBox{padding:22px;margin-top:24px}.secT{font-size:24px}}
</style>
</head>
<body>
<header><div class="hwrap">
  <a class="brand" href="./"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span><h1 id="title">ألعابي</h1></a>
  <span class="grow"></span>
  <div class="who" id="who" hidden><span class="av" id="whoAv" aria-hidden="true"></span><span id="whoName"></span><button class="out sm" id="out" data-t="out"></button></div>
  <button class="out sm" id="lang" type="button"></button>
</div></header>
<main>
<!-- sign in -->
<section class="card" id="signBox" hidden>

  <label class="f"><span data-t="pass"></span><input id="p" type="password" maxlength="100" autocomplete="current-password"></label>
  <button id="login" data-t="login"></button>
  <button class="out" id="reg" data-t="reg"></button>
  <p class="err" id="signErr" role="alert"></p>
</section>

<div id="home" hidden>
  <h2 class="secT" data-t="yourGames"></h2>
  <div class="games" id="games"></div>
  <div class="cols">
    <div class="colMain">
      <section class="card" id="roomsBox">
        <h2 style="font-size:20px;font-weight:700" data-t="rooms"></h2>
        <p class="mut" style="margin:4px 0 0" data-t="roomsS"></p>
        <div class="roomGrid">
          <div><b data-t="mkTitle"></b><label class="f"><span data-t="game"></span><select id="rg"></select></label><button id="mkRoom" data-t="mkRoom"></button></div>
          <div><b data-t="joinTitle"></b><label class="f"><span data-t="code"></span><input id="rc" maxlength="12" placeholder="7BT32" dir="ltr" autocomplete="off"></label><button class="dark" id="joinRoom" data-t="join"></button></div>
        </div>
        <p class="err" id="roomErr" role="alert" style="margin-top:10px"></p>
        <h3 class="pubT" data-t="pubRooms"></h3><div id="pub"></div>
      </section>

      <section class="card" id="roomView" hidden>
        <div class="rvTop">
          <div><span class="mut" style="font-size:13px"><span data-t="room"></span> · <span id="rvInfo"></span></span>
            <div style="display:flex;align-items:center;gap:10px"><span class="code" id="rvCode"></span><button class="icoBtn" id="rvCopy" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button></div></div>
          <a class="btn" id="rvPlay" data-t="openGame"></a><button class="danger" id="rvLeave" data-t="leave"></button>
        </div>
        <div class="rvBody">
          <div class="rvPl"><h3><span data-t="players"></span> <span dir="ltr" id="rvCount"></span></h3><div id="rvPlayers" style="display:flex;flex-direction:column;gap:8px"></div></div>
          <div class="rvCh"><h3 data-t="chat"></h3><div id="chat" aria-live="polite"></div>
            <div class="sendRow"><label style="flex:1;display:flex"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)" data-t="msg"></span><input id="msg" maxlength="300" data-tp="msg" dir="auto"></label><button id="send" data-t="send"></button></div></div>
        </div>
      </section>
    </div>

    <aside class="colSide">
      <section class="card side" id="accBox">
        <h2 data-t="acc"></h2>
        <label class="f"><span data-t="oldPass"></span><input id="op" type="password"></label>
        <label class="f"><span data-t="newPass"></span><input id="np" type="password"></label>
        <button class="dark" id="chg" data-t="chg"></button>
        <p class="err" id="accErr"></p>
      </section>

      <section class="card side" id="adminBox" hidden>
        <div class="admTop"><h2 data-t="admT"></h2><span class="badge" data-t="admin"></span></div>
        <label class="f"><span data-t="siteName"></span><input id="aTitle" maxlength="60" dir="auto"></label>
        <label class="f"><span data-t="siteNameEn"></span><input id="aTitleEn" maxlength="60" dir="ltr"></label>
        <div class="swatches"><label class="f"><input type="color" id="aAcc"><span data-t="cAcc"></span></label><label class="f"><input type="color" id="aBg"><span data-t="cBg"></span></label><label class="f"><input type="color" id="aCard"><span data-t="cCard"></span></label></div>
        <h3 data-t="gamesL"></h3><div id="aGames" style="display:flex;flex-direction:column;gap:8px"></div>
        <div class="admBtns"><button id="aAdd" data-t="addGame"></button><button id="aSave" data-t="saveSite"></button></div>
        <p class="err" id="aErr"></p>
        <p class="note" data-t="admNote"></p>
      </section>
    </aside>
  </div>
</div>
</main>

  for(const el of document.querySelectorAll('[data-t]'))el.textContent=T(el.dataset.t);
  for(const el of document.querySelectorAll('[data-tp]'))el.placeholder=T(el.dataset.tp);
  $('rvCopy').setAttribute('aria-label',T('copy'));$('lang').textContent=LANG==='ar'?'English':'عربي';paint();if(acc)$('whoName').textContent=T('hi')+acc.user;if(acc&&acc.admin)drawAG()}
$('lang').onclick=()=>{LANG=LANG==='ar'?'en':'ar';try{localStorage.setItem('billi-lang',LANG)}catch(e){}applyLang();if(acc&&!room)listRooms()};
function paint(){const c=site||{},R_=document.documentElement.style;const acc=pick(c.accent,'accent','#2446F5'),bg=pick(c.bg,'bg','#F4F2ED'),cd=pick(c.card,'card','#FFFFFF'),dk=lum(cd)<.5,bgDk=lum(bg)<.5;
  R_.setProperty('--acc',acc);R_.setProperty('--bg',bg);R_.setProperty('--card',cd);R_.setProperty('--surface',cd);
  R_.setProperty('--field',mix(cd,dk?'#ffffff':'#000000',.04));R_.setProperty('--ink',dk?'#F2F3F7':'#16161D');R_.setProperty('--mute',dk?'#B4B9C9':'#5F5C68');
  R_.setProperty('--line',mix(cd,dk?'#ffffff':'#000000',dk?.14:.1));R_.setProperty('--line2',mix(cd,dk?'#ffffff':'#000000',dk?.22:.16));
  R_.setProperty('--bgInk',bgDk?'#F2F3F7':'#16161D');R_.setProperty('--bgMute',bgDk?'#C9CCD6':'#5F5C68');R_.setProperty('--accInk',lum(acc)>.6?'#16161D':'#FFFFFF');
  document.documentElement.style.colorScheme=dk?'dark':'light';
  const ttl=LANG==='en'?(c.title_en||AR_EN[c.title]||(/[\u0600-\u06FF]/.test(c.title||'')?'My games':c.title)||'My games'):(c.title||T('myGames'));$('title').textContent=ttl;document.title=ttl;
  $('games').innerHTML=(c.games||[]).map(g=>{const pic=g.img||GAME_PIC[g.id]||'';return`<article class="game"><div class="pic">${pic?`<img src="${esc(pic)}" alt="">`:''}${g.online?`<span class="pill"><i></i>${T('online')}</span>`:''}</div><div class="gb"><div><b>${esc(gTx(g,'name'))}</b><span>${esc(gTx(g,'desc'))}</span></div><a class="btn" href="${esc(g.path)}">${T('play')}</a></div></article>`}).join('');
  const sel=$('rg').value;$('rg').innerHTML=(c.games||[]).map(g=>`<option value="${esc(g.id)}">${esc(gTx(g,'name'))}</option>`).join('');if(sel)$('rg').value=sel}
async function boot(){
  try{site=await GameNet.site(S)}catch(e){site=null}applyLang();
  acc=GameNet.signedIn(S);
  if(acc){try{const i=await acc.info();acc.cred.admin=!!i.admin}catch(e){if(e.status===401){GameNet.signOut(S);acc=null}}}
  show()}
function show(){const inn=!!acc;$('signBox').hidden=inn;$('home').hidden=!inn;$('who').hidden=!inn;if(!inn)return;
  $('whoName').textContent=T('hi')+acc.user;$('whoAv').textContent=initial(acc.user);$('adminBox').hidden=!acc.admin;if(acc.admin)adminFill();listRooms()}
async function sign(kind){$('signErr').textContent='';const u=$('u').value.trim(),p=$('p').value;if(!u||!p){$('signErr').textContent=T('need');return}
  try{acc=await GameNet[kind](S,u,p);if(kind==='login'){const i=await acc.info();acc.cred.admin=!!i.admin}$('p').value='';show()}catch(e){$('signErr').textContent=msgOf(e)}}
$('login').onclick=()=>sign('login');$('reg').onclick=()=>sign('register');$('p').onkeydown=e=>{if(e.key==='Enter')sign('login')};
$('out').onclick=()=>{if(room)room.leave();room=null;GameNet.signOut(S);acc=null;$('roomView').hidden=true;$('roomsBox').hidden=false;show()};
$('chg').onclick=async()=>{$('accErr').textContent='';$('accErr').classList.remove('ok');try{await acc.changePassword($('op').value,$('np').value);$('op').value=$('np').value='';$('accErr').textContent=T('chgOk');$('accErr').classList.add('ok')}catch(e){$('accErr').textContent=msgOf(e)}};
// rooms
async function listRooms(){const g=$('rg').value;if(!g)return;try{const L=await GameNet.list(S,g),gm=((site&&site.games)||[]).find(x=>x.id===g),gn=gm?gTx(gm,'name'):'';
  $('pub').innerHTML=L.length?L.map(r=>{const n=r.label||r.host||T('aRoom');return`<div class="pr"><span class="av" aria-hidden="true">${esc(initial(n))}</span><div><b>${esc(n)}</b><small>${esc(gn)}</small></div><span class="cnt">${r.players} / ${r.max}</span><button class="out sm" data-c="${esc(r.code)}">${T('join')}</button></div>`}).join(''):`<div class="noPub">${T('noPub')}</div>`;
  for(const b of $('pub').querySelectorAll('button'))b.onclick=()=>enter(b.dataset.c)}catch(e){$('pub').textContent=''}}
$('rg').onchange=listRooms;setInterval(()=>{if(acc&&!room)listRooms()},15000);
async function enter(code){$('roomErr').textContent='';if(room){room.leave();room=null}const g=$('rg').value;
  try{room=await GameNet.join({server:S,game:g,code,name:acc.user,max:8,public:!code});}catch(e){$('roomErr').textContent=msgOf(e);return}
  $('roomsBox').hidden=true;$('roomView').hidden=false;$('rvCode').textContent=room.code;$('chat').innerHTML='';
  const gm=((site&&site.games)||[]).find(x=>x.id===g);$('rvPlay').href=(gm?gm.path:g+'/')+'?room='+room.code;$('rvInfo').textContent=gm?gTx(gm,'name'):'';
  const draw=()=>{const P=[...room.players.values()];$('rvCount').textContent='('+P.length+'/'+((room.info&&room.info.max)||8)+')';
    $('rvPlayers').innerHTML=P.map(p=>`<div class="pl${p.id===room.id?' me':''}"><span class="av" aria-hidden="true">${esc(initial(p.name))}</span><span>${esc(p.name)}${p.id===room.id?T('you'):''}</span>${p.id===room.host?`<span class="hostB">${T('host')}</span>`:''}</div>`).join('')};
  const sys=t=>{const d=document.createElement('div');d.className='sys';d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=1e9};
  const bub=(who,t,mine)=>{const d=document.createElement('div');d.className='bub'+(mine?' mine':'');d.innerHTML=`<b>${esc(who)}</b>${esc(t)}`;$('chat').appendChild(d);$('chat').scrollTop=1e9};
  room.on('join',p=>{draw();sys(p.name+T('joined'))}).on('leave',(id,p)=>{draw();sys((p?p.name:T('aPlayer'))+T('left'))}).on('host',draw)
    .on('msg',(d,from)=>{if(d&&d.chat){const p=room.players.get(from);bub(p?p.name:'?',d.chat)}}).on('status',s=>{if(s==='closed'){$('rvInfo').textContent=T('lost')}});
  room._bub=bub;draw();sys(T('codeIs')+room.code+T('give'))}
$('mkRoom').onclick=()=>enter(null);$('joinRoom').onclick=()=>{const c=$('rc').value.trim().toUpperCase();if(c)enter(c)};$('rc').onkeydown=e=>{if(e.key==='Enter')$('joinRoom').click()};
$('send').onclick=()=>{const t=$('msg').value.trim();if(!t||!room)return;room.send({chat:t});room._bub(acc.user,t,true);$('msg').value=''};
$('msg').onkeydown=e=>{if(e.key==='Enter')$('send').click()};
$('rvCopy').onclick=()=>{const c=$('rvCode').textContent;try{navigator.clipboard.writeText(c).then(()=>{$('rvCopy').title=T('copied')})}catch(e){}};
$('rvLeave').onclick=()=>{if(room)room.leave();room=null;$('roomView').hidden=true;$('roomsBox').hidden=false;listRooms()};
// admin: the site's look and games (each game can have an English name and description, and a picture)
let AG=[];
function adminFill(){const c=site||{};$('aTitle').value=c.title||'';$('aTitleEn').value=c.title_en||AR_EN[c.title]||'';$('aAcc').value=pick(c.accent,'accent','#2446F5');$('aBg').value=pick(c.bg,'bg','#F4F2ED');$('aCard').value=pick(c.card,'card','#FFFFFF');AG=JSON.parse(JSON.stringify(c.games||[]));for(const g of AG){const k=KNOWN_EN[g.id];if(k){if(!g.name_en)g.name_en=k.name;if(!g.desc_en)g.desc_en=k.desc}}drawAG()}
function drawAG(){const inp=(i,k,v,tp,dir)=>`<input data-i="${i}" data-k="${k}" value="${esc(v)}" placeholder="${T(tp)}" aria-label="${T(tp)}" dir="${dir}">`;
  $('aGames').innerHTML=AG.map((g,i)=>`<div class="ge">${inp(i,'name',g.name,'gName','auto')}${inp(i,'name_en',g.name_en,'gNameEn','ltr')}${inp(i,'desc',g.desc,'gDesc','auto')}${inp(i,'desc_en',g.desc_en,'gDescEn','ltr')}${inp(i,'id',g.id,'gId','ltr')}${inp(i,'path',g.path,'gPath','ltr')}${inp(i,'img',g.img,'gImg','ltr')}<label><input type="checkbox" data-i="${i}" data-k="online" ${g.online?'checked':''}>${T('gOnline')}</label><button type="button" data-del="${i}">${T('del')}</button></div>`).join('');
  for(const el of $('aGames').querySelectorAll('input'))el.oninput=el.onchange=()=>{const g=AG[+el.dataset.i];g[el.dataset.k]=el.type==='checkbox'?el.checked:el.value};
  for(const b of $('aGames').querySelectorAll('[data-del]'))b.onclick=()=>{AG.splice(+b.dataset.del,1);drawAG()}}
$('aAdd').onclick=()=>{AG.push({id:'',name:'',name_en:'',desc:'',desc_en:'',path:'',img:'',online:false});drawAG()};
$('aSave').onclick=async()=>{$('aErr').textContent='';$('aErr').style.color='';try{site=await acc.setSite({title:$('aTitle').value,title_en:$('aTitleEn').value,accent:$('aAcc').value,bg:$('aBg').value,card:$('aCard').value,games:AG});paint();adminFill();$('aErr').textContent=T('saved');$('aErr').style.color='#7EE2B0'}catch(e){$('aErr').textContent=msgOf(e)}};
boot();
</script>
</body>
</html>
