<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ألعابي</title>
<style>
:root{--bg:#0e0b14;--card:#1a1524;--line:#2e2640;--tx:#f1ecf8;--mut:#a397b8;--acc:#e0559a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100dvh}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:28px;margin:8px 0 20px}
h2{font-size:18px;margin:0 0 12px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:28px}
.game{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;color:inherit;text-decoration:none}
.game:hover{border-color:var(--acc)}
.game b{font-size:20px;display:block}
.game span{color:var(--mut);font-size:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
input{flex:1;min-width:140px;background:#0b0911;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:10px 12px;font:inherit}
button{background:var(--acc);border:0;border-radius:10px;color:#fff;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:#2e2640}
.mut{color:var(--mut);font-size:14px}
.code{font:700 22px/1 ui-monospace,monospace;letter-spacing:2px;direction:ltr;display:inline-block}
</style>
</head>
<body>
<main>
<h1>ألعابي</h1>
<div class="games">
  <a class="game" href="billi/"><b>الملكة بيلي</b><span>قصة وقتال</span></a>
</div>

<div class="box">
  <h2>حسابي</h2>
  <div class="mut" id="st">جاري التحميل…</div>
  <div class="row"><input id="nm" maxlength="24" placeholder="اسمك"><button id="sv">حفظ الاسم</button></div>
</div>

<div class="box">
  <h2>نقل الحساب لجهاز ثاني</h2>
  <div class="mut">اطلع كود من هذا الجهاز واكتبه في الجهاز الثاني. الكود يشتغل مرة وحدة خلال 24 ساعة.</div>
  <div class="row"><button class="sec" id="mk">اطلع كود</button><span class="code" id="cd"></span></div>
  <div class="row"><input id="cl" placeholder="اكتب الكود هنا" dir="ltr"><button id="go">ادخل بالكود</button></div>
</div>
</main>
<script src="net.js"></script>
<script>
const S=location.origin,$=id=>document.getElementById(id);let acc;
async function load(){
  try{acc=await GameNet.account(S);const i=await acc.info();$('nm').value=i.name||'';$('st').textContent='حسابك جاهز على هذا الجهاز.'}
  catch(e){$('st').textContent='ما قدرت أوصل للسيرفر: '+e.message}
}
$('sv').onclick=async()=>{try{await acc.setName($('nm').value.trim());$('st').textContent='تم حفظ الاسم.'}catch(e){$('st').textContent=e.message}};
$('mk').onclick=async()=>{try{const r=await acc.transferCode();$('cd').textContent=r.code}catch(e){$('cd').textContent=e.message}};
$('go').onclick=async()=>{const c=$('cl').value.trim();if(!c)return;try{await GameNet.claim(S,c);$('cl').value='';await load();$('st').textContent='تم نقل الحساب لهذا الجهاز.'}catch(e){$('st').textContent=e.message}};
load();
</script>
</body>
</html>
