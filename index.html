<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Billi Fighter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: full-bleed 3D arena; fighting-game HUD (mirrored health bars + timer) pinned on top; menus are steel panels over the arena; touch pad on phones. Single deliberate night-arena look. */
:root{
  --night:#0d0c11;
  --steel:#1b1a22;
  --ink:#f3eee8;
  --muted:#a59f9b;
  --hp:#f4c24d;
  --trail:#d7392b;
  --rage:#ff3a2a;
  --ember:#ff7a2f;
  --ice:#4fd6ff;
  --line:rgba(243,238,232,.14);
  --f-display:"Lalezar","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:16px;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
.app{position:relative;height:100%;overflow:hidden}
#c3{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;padding-top:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.side{display:flex;flex-direction:column;gap:5px;min-width:0}
.side.p2{align-items:flex-end}
.nm{font-family:var(--f-display);font-size:22px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.6);display:flex;gap:8px;align-items:center}
.p2 .nm{flex-direction:row-reverse}
.nm small{font-family:var(--f-body);font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--rage);opacity:0;transition:opacity .2s}
.side.rage .nm small{opacity:1}
.bar{position:relative;width:100%;height:20px;background:#0a090c;border:2px solid #3a3740;border-radius:4px;overflow:hidden;transform:skewX(-14deg)}
.p2 .bar{transform:skewX(14deg)}
.bar i{position:absolute;top:0;bottom:0;left:0;width:100%}
.p2 .bar i{left:auto;right:0}
.bar .tr{background:var(--trail)}
.bar .hp{background:linear-gradient(180deg,#ffe08a,var(--hp) 55%,#c9902a)}
.bar .hpg{background:linear-gradient(180deg,#9dff8a,#3fcf4a 55%,#1f8a2a)}
.side.rage .bar .hp{box-shadow:0 0 14px var(--hp)}
.side.rage .bar{border-color:var(--hp);box-shadow:0 0 10px var(--hp)}
.heat{position:relative;width:62%;height:9px;background:#0a090c;border:1px solid #3a3740;border-radius:3px;overflow:hidden}
.p2 .heat{align-self:flex-end}
.heat i{position:absolute;top:0;bottom:0;left:0;width:0;background:linear-gradient(90deg,#8a1a10,var(--rage))}
.p2 .heat i{left:auto;right:0;background:linear-gradient(270deg,#8a1a10,var(--rage))}
.heat span{position:absolute;inset:0;display:grid;place-items:center;font-size:8px;font-weight:800;letter-spacing:.08em;color:#fff;opacity:0}
.heat.ready{border-color:var(--rage);box-shadow:0 0 12px var(--rage);animation:hpulse .6s ease-in-out infinite alternate}
.heat.ready span{opacity:1}
@keyframes hpulse{from{filter:brightness(1)}to{filter:brightness(1.6)}}
#bpad [data-k=rage].ready{background:rgba(255,58,42,.5);color:#fff;box-shadow:0 0 16px var(--rage)}
.wins{display:flex;gap:6px}
.wins b{width:12px;height:12px;border-radius:50%;border:2px solid #57525c;background:transparent}
.wins b.on{background:var(--hp);border-color:var(--hp);box-shadow:0 0 8px var(--hp)}
.timer{font-family:var(--f-display);font-size:42px;line-height:1;min-width:64px;text-align:center;padding:4px 8px;background:rgba(10,9,12,.7);border:2px solid #3a3740;border-radius:8px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--rage)}
.combo{position:absolute;top:96px;z-index:2;font-family:var(--f-display);font-size:34px;line-height:1;color:var(--hp);text-shadow:0 3px 0 #000,0 0 18px rgba(244,194,77,.5);pointer-events:none;opacity:0;transition:opacity .25s}
.combo span{display:block;font-size:16px;color:var(--ink)}
#cb1{left:max(20px,env(safe-area-inset-left,0px))}
#cb2{right:max(20px,env(safe-area-inset-right,0px));text-align:right}
.combo.show{opacity:1}
.banner{position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none}
.banner b{font-family:var(--f-display);font-weight:400;font-size:clamp(48px,11vw,120px);line-height:1;color:var(--ink);text-shadow:0 6px 0 #000,0 0 40px rgba(255,122,47,.6);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.banner b.red{color:var(--rage)}
.banner b.gold{color:var(--hp)}
.banner b.sm{font-size:clamp(28px,6vw,56px)}
@keyframes pop{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
.flash{position:absolute;inset:0;z-index:1;background:radial-gradient(circle,transparent 30%,rgba(255,40,20,.55));opacity:0;pointer-events:none;transition:opacity .4s}
.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:16px;overflow:auto;background:rgba(8,7,10,.55)}
#menu:not([hidden]),#endScr:not([hidden]){display:flex}#menu>.panel,#endScr>.panel{margin:auto}
.panel{background:linear-gradient(180deg,#22202a,#15141a);border:1px solid var(--line);border-top:3px solid var(--ember);border-radius:10px;padding:22px;width:min(620px,100%);box-sizing:border-box;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.panel h1{font-family:var(--f-display);font-weight:400;font-size:52px;line-height:1;margin:0;text-align:center;color:var(--ink);text-shadow:0 4px 0 #000,0 0 30px rgba(255,122,47,.45);text-wrap:balance}
.panel h1 em{font-style:normal;color:var(--ember)}
.sub{margin:0;text-align:center;color:var(--muted);line-height:1.6}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.vs div{padding:10px;border-radius:8px;background:rgba(243,238,232,.04);border:1px solid var(--line)}
.vs strong{display:block;font-family:var(--f-display);font-weight:400;font-size:26px}
.vs small{color:var(--muted);font-size:13px}
.vs .x{font-family:var(--f-display);font-size:30px;color:var(--ember)}
.seg{display:flex;gap:8px}
.seg button{flex:1;font-family:var(--f-body);font-weight:800;font-size:15px;padding:10px;border-radius:8px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--ember);background:rgba(255,122,47,.14)}
.lbl{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.05em;margin-bottom:6px}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:14px;line-height:1.5}
@media (max-width:520px){.moves{grid-template-columns:1fr}}
.moves div{display:flex;gap:8px;align-items:baseline;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:4px}
.moves span{color:var(--muted)}
kbd{font-family:var(--f-body);font-weight:800;font-size:12px;border:1px solid var(--line);border-bottom-width:3px;border-radius:5px;padding:1px 6px;color:var(--ink);white-space:nowrap}
.tag{font-size:11px;font-weight:800;padding:1px 6px;border-radius:4px;margin-inline-start:4px}
.t-h{background:rgba(79,214,255,.16);color:var(--ice)}.t-m{background:rgba(244,194,77,.16);color:var(--hp)}.t-l{background:rgba(255,58,42,.16);color:#ff8a7e}
.btn{font-family:var(--f-display);font-size:26px;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;background:var(--ember);color:#1a0d05;box-shadow:0 5px 0 #a8461a}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a8461a}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{padding:10px 4px;border-radius:8px;background:rgba(243,238,232,.05)}
.stats b{display:block;font-family:var(--f-display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}

.app:not(.fighting) .hud,.app:not(.fighting) .combo{display:none}
.langrow{display:flex;justify-content:flex-end}
.lang{font-family:var(--f-body);font-weight:800;font-size:13px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 12px;cursor:pointer}
.keys{position:absolute;z-index:3;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;max-width:calc(100% - 32px);padding:8px 12px;border-radius:8px;background:rgba(10,9,12,.62);border:1px solid var(--line);font-size:12px;color:var(--muted);pointer-events:none}
.keys.static{position:static;transform:none;max-width:none;background:rgba(243,238,232,.04);font-size:13px;padding:10px}
.keys .k{display:flex;align-items:center;gap:5px;white-space:nowrap}
.keys .k b{font-weight:700;color:var(--ink)}
.keys .sep{width:1px;align-self:stretch;background:var(--line)}
.app:not(.fighting) #keysHud,.app.nokeys #keysHud{display:none}
@media (pointer:coarse){#keysHud,.keysTitle{display:none}}
.howto summary{cursor:pointer;font-weight:800;color:var(--muted);padding:6px 0}
.howto[open] summary{margin-bottom:8px}
.sel{place-items:end start;background:linear-gradient(90deg,rgba(8,7,10,.78),rgba(8,7,10,.15) 55%,transparent)}
[dir=rtl] .sel{background:linear-gradient(270deg,rgba(8,7,10,.78),rgba(8,7,10,.15) 55%,transparent)}
.selpanel{width:min(440px,100%);max-height:100%;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;padding:18px;background:rgba(21,20,26,.86);border:1px solid var(--line);border-top:3px solid var(--ember);border-radius:10px;align-self:center}
.selhead{display:flex;flex-direction:column;gap:2px}
.step{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ember)}
.selhead h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1}
.roster{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:8px;border:2px solid var(--line);background:rgba(243,238,232,.04);color:var(--ink);cursor:pointer;font-family:var(--f-body)}
.card[aria-pressed=true]{border-color:var(--ember);background:rgba(255,122,47,.14)}
.card.taken{opacity:.45}
.swatch{width:40px;height:40px;border-radius:50%;position:relative;overflow:hidden;border:2px solid rgba(0,0,0,.4)}
.swatch i{position:absolute;inset:0}
.card small.crown{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--hp);margin-top:-4px}
.card b{font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1}
.detail{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:8px;background:rgba(243,238,232,.04)}
.dname{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dname strong{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1}
.dname span{color:var(--ember);font-weight:800;font-size:13px}
.dstance{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.specials{display:flex;flex-direction:column;gap:6px}
.specials div{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:14px;border-top:1px dashed var(--line);padding-top:6px}
.specials em{font-style:normal;font-weight:800}
.specials span{color:var(--muted);white-space:nowrap}
@media (max-width:640px){.sel,[dir=rtl] .sel{place-items:end stretch;background:linear-gradient(0deg,rgba(8,7,10,.85),transparent 70%)}.selpanel{max-height:60%;align-self:end}.selhead h2{font-size:24px}}
.credit{margin:0;text-align:center;font-size:12px;color:var(--muted)}
button:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
.pad{direction:ltr;position:absolute;z-index:4;bottom:max(14px,env(safe-area-inset-bottom,0px));display:none}
@media (pointer:coarse){.pad{display:grid}}
.pad button{width:58px;height:58px;border-radius:50%;border:2px solid rgba(243,238,232,.25);background:rgba(20,19,25,.55);color:var(--ink);font-family:var(--f-display);font-size:20px;touch-action:none;padding:0}
.pad button.on{background:rgba(255,122,47,.45)}
#dpad{left:max(14px,env(safe-area-inset-left,0px));grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,52px);gap:2px}
#dpad [data-k=up]{grid-column:2;grid-row:1}#dpad [data-k=left]{grid-column:1;grid-row:2}#dpad [data-k=right]{grid-column:3;grid-row:2}#dpad [data-k=down]{grid-column:2;grid-row:3}
#bpad{right:max(14px,env(safe-area-inset-right,0px));grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,52px);gap:2px}
#bpad [data-k=h]{grid-column:1;grid-row:1;font-size:15px}#bpad [data-k=block]{grid-column:3;grid-row:1;font-size:15px}#bpad [data-k=k]{grid-column:3;grid-row:3;font-size:15px}
#bpad [data-k=jump]{grid-column:1;grid-row:3;font-size:14px}
#bpad [data-k=rage]{grid-column:2;grid-row:2;border-color:var(--rage);color:var(--rage);font-size:15px}
#pauseBtn{position:absolute;z-index:4;top:76px;left:50%;transform:translateX(-50%);font-family:var(--f-body);font-weight:800;font-size:12px;background:rgba(10,9,12,.6);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.banner b{animation:none}.heat.ready{animation:none}.btn:active{transform:none}}
</style>

<div class="app" id="app">
  <canvas id="c3" aria-label="ساحة القتال في المصنع"></canvas>
  <div class="flash" id="flash"></div>

  <div class="hud" dir="ltr">
    <div class="side p1" id="s1">
      <div class="nm"><span id="n1">ليان</span> <small data-i18n="rage"></small></div>
      <div class="bar"><i class="tr" id="tr1"></i><i class="hp" id="hp1"></i><i class="tr" id="tg1"></i><i class="hpg" id="hg1"></i></div>
      <div class="heat" id="hb1"><i id="ht1"></i><span data-i18n="rageReady"></span></div>
      <div class="wins" id="w1"><b></b><b></b></div>
    </div>
    <div class="timer" id="timer">99</div>
    <div class="side p2" id="s2">
      <div class="nm"><span id="n2">ريم</span> <small data-i18n="rage"></small></div>
      <div class="bar"><i class="tr" id="tr2"></i><i class="hp" id="hp2"></i><i class="tr" id="tg2"></i><i class="hpg" id="hg2"></i></div>
      <div class="heat" id="hb2"><i id="ht2"></i><span data-i18n="rageReady"></span></div>
      <div class="wins" id="w2"><b></b><b></b></div>
    </div>
  </div>
  <button id="pauseBtn" hidden data-i18n="pause"></button>
  <div class="combo" id="cb1"></div>
  <div class="combo" id="cb2"></div>
  <div class="banner" id="banner"></div>
  <div class="keys" id="keysHud" dir="ltr"></div>

  <div class="pad" id="dpad">
    <button data-k="up" aria-label="قفز">▲</button><button data-k="left" aria-label="يسار">◀</button><button data-k="right" aria-label="يمين">▶</button><button data-k="down" aria-label="انحناء">▼</button>
  </div>
  <div class="pad" id="bpad">
    <button data-k="h" aria-label="Punch" data-i18n="padH"></button><button data-k="block" aria-label="Block" data-i18n="padP"></button><button data-k="rage" aria-label="Rage" data-i18n="rage"></button><button data-k="k" aria-label="Kick" data-i18n="padK"></button><button data-k="jump" aria-label="Jump" data-i18n="jumpShort"></button>
  </div>

  <div class="overlay" id="menu">
    <div class="panel">
      <div class="langrow"><button class="lang" id="langBtn" type="button">English</button></div>
      <h1 dir="ltr">Billi <em>Fighter</em></h1>
      <p class="sub" data-i18n="tagline"></p>
      <button class="btn" id="startBtn" data-i18n="play"></button>
      <div class="keysTitle"><div class="lbl" data-i18n="controls"></div><div class="keys static" id="keysMenu" dir="ltr"></div></div>
      <details class="howto">
        <summary data-i18n="howto"></summary>
        <p class="lbl" data-i18n="howtoIntro"></p>
        <div class="moves" id="movesList"></div>
      </details>
      <p class="credit" id="loadNote" hidden data-i18n="loading"></p>
      <p class="credit" dir="ltr">Arena: “old factory FREE” by dasy444 · Sketchfab · Gentleman avatar: Ready Player Me (three.js examples)</p>
    </div>
  </div>

  <div class="overlay sel" id="select" hidden>
    <div class="selpanel">
      <div class="selhead">
        <div class="langrow" style="justify-content:space-between;align-items:center"><span class="step" id="selStep"></span><button class="lang" id="langBtn2" type="button">English</button></div>
        <h2 id="selTitle"></h2>
      </div>
      <div class="roster" id="roster"></div>
      <div class="detail">
        <div class="dname"><strong id="dName"></strong><span id="dStyle"></span></div>
        <p class="dstance" id="dStance"></p>
        <div class="specials" id="dSpecials"></div>
      </div>
      <div id="diffWrap" hidden>
        <div class="lbl" data-i18n="difficulty"></div>
        <div class="seg" id="diff">
          <button data-d="0" aria-pressed="false" data-i18n="easy"></button>
          <button data-d="1" aria-pressed="true" data-i18n="normal"></button>
          <button data-d="2" aria-pressed="false" data-i18n="hard"></button>
        </div>
      </div>
      <div class="row">
        <button class="btn ghost" id="selBack" data-i18n="back"></button>
        <button class="btn ghost" id="selRandom" hidden data-i18n="random"></button>
        <button class="btn" id="selOk"></button>
      </div>
    </div>
  </div>

  <div class="overlay" id="endScr" hidden>
    <div class="panel">
      <h1 id="endTitle"></h1>
      <p class="sub" id="endSub"></p>
      <div class="stats">
        <div><b id="stDmg">0</b><span data-i18n="stDmg"></span></div>
        <div><b id="stCombo">0</b><span data-i18n="stCombo"></span></div>
        <div><b id="stHits">0</b><span data-i18n="stHits"></span></div>
      </div>
      <div class="row">
        <button class="btn" id="againBtn" data-i18n="rematch"></button>
        <button class="btn ghost" id="menuBtn" data-i18n="changeFighters"></button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/libs/meshopt_decoder.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const STEP=1/60;

/* ================= Input ================= */
const KEYS={KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',
  KeyH:'h',KeyK:'k',KeyP:'block',KeyO:'rage',KeyL:'rage',Space:'jump'};
let tick=0;
const pin={held:{},buf:{},tap:{},dash:{},side:null,jumpUsed:false};
function press(k){if(pin.held[k])return;pin.held[k]=true;pin.buf[k]=tick;
  if(k==='left'||k==='right'){if(tick-(pin.tap[k]??-99)<14)pin.dash[k]=tick;pin.tap[k]=tick}}
function release(k){pin.held[k]=false;if((k==='up'||k==='down')&&tick-(pin.buf[k]??-99)<=10&&!pin.noSide)pin.side={dir:k,t:tick};if(k==='up'||k==='down'){pin.noSide=false}if(k==='up')pin.jumpUsed=false}
addEventListener('keydown',e=>{
  if(e.code==='Tab'){e.preventDefault();$('app').classList.toggle('nokeys');return}
  if(e.code==='Escape'){if(phase!=='menu'&&phase!=='end'&&phase!=='select')togglePause();return}
  const k=KEYS[e.code];if(!k)return;e.preventDefault();if(!e.repeat)press(k)});
addEventListener('keyup',e=>{const k=KEYS[e.code];if(k)release(k)});
addEventListener('blur',()=>{pin.held={};if(phase==='fight'&&!paused)togglePause()});
$('c3').addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;const k=e.button===2?'k':e.button===0?'h':null;if(k){press(k);setTimeout(()=>release(k),60)}});
$('c3').addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('.pad button').forEach(b=>{

/* ================= Audio ================= */
let ac=null,master=null,nbuf=null;
function initAudio(){
  // iPhone mutes Web Audio while the ring/silent switch is off unless the page asks for "playback" audio
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(ac){if(ac.state!=='running')ac.resume();return}
  try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(ac.destination);
  master=ac.createGain();master.gain.value=1.1;master.connect(comp);
  // unlock: play one silent sample inside the user gesture
  try{const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0)}catch(e){}
  ac.resume();
  nbuf=ac.createBuffer(1,ac.sampleRate*.4,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
['pointerdown','keydown','touchend'].forEach(ev=>addEventListener(ev,()=>initAudio(),{passive:true}));
function sfx(kind){
  if(!ac)return;if(ac.state!=='running')ac.resume();const t=ac.currentTime;
  const nz=(f,type,v,dec)=>{const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nbuf;fl.type=type;fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dec);s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+dec+.02)};
  const th=(f0,f1,v,dec,type='sine')=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dec);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dec);o.connect(g);g.connect(master);o.start(t);o.stop(t+dec+.02)};
  // hits: a sharp crack on top of a body thump, so every blow lands with weight
  if(kind==='hit'){nz(5000,'highpass',.55,.035);nz(1600,'lowpass',.9,.09);th(220,55,.9,.11)}
  else if(kind==='heavy'){nz(5000,'highpass',.7,.05);nz(1100,'lowpass',1,.2);th(150,35,1.2,.26);th(70,30,.8,.3,'triangle')}
  else if(kind==='kick'){nz(4200,'highpass',.6,.04);nz(900,'lowpass',1,.14);th(120,40,1.1,.18)}
  else if(kind==='head'){th(520,140,.7,.09,'square');nz(2500,'bandpass',.6,.06);th(160,50,1,.16)}
  else if(kind==='belly'){th(110,70,1,.12);th(70,140,.6,.18,'sine');nz(500,'lowpass',.8,.15)}
  else if(kind==='block'){nz(3500,'bandpass',.5,.06);th(900,600,.15,.05,'square')}
  else if(kind==='whoosh'){nz(900,'bandpass',.12,.12)}
  else if(kind==='dash'){nz(1400,'bandpass',.35,.22);th(300,900,.08,.18,'sine')}
  else if(kind==='land'){th(90,35,.7,.25);nz(400,'lowpass',.4,.2)}
  else if(kind==='ko'){th(110,30,1,1.1,'sawtooth');nz(600,'lowpass',.9,.8)}
  else if(kind==='rage'){th(70,220,.5,.6,'sawtooth');nz(2500,'bandpass',.3,.5)}
  else if(kind==='bell'){th(880,870,.25,.9,'triangle');th(1320,1310,.12,.7,'triangle')}
}

let p1,p2,phase='menu',phaseT=0,round=1,wins=[0,0],timer=60,timeScale=1,slowT=0,hitstop=0,paused=false,koWinner=null,moveSeq=0,diff=1;
const DIFF=[{react:20,block:.22,aggr:.03,lowRead:.15,juggle:.3},{react:13,block:.5,aggr:.05,lowRead:.45,juggle:.6},{react:8,block:.78,aggr:.075,lowRead:.75,juggle:.9}];

function setState(f,s){f.state=s;f.st=0}
const MAXHP=200;
function free(f){return['idle','walkF','walkB','crouch','run'].includes(f.state)}
function pressedF(f,k,win){return tick-(f.buf[k]??-999)<=win}
function consume(f,k){f.buf[k]=-999}

function startMove(f,name,o){
  if(o){const u=toOpp(f,o);f.ax=u.ux;f.az=u.uz}
  setState(f,'attack');f.move=name;f.mf=0;f.hitDone=[];f.moveId=++moveSeq;f.connected=false;f.rageBlocked=false;
  for(const k of['h','k','rage'])consume(f,k);

function resolveMove(f,n){if(n[0]!=='@')return n;const k=n.slice(1),c=CHARS[f.id];return(c&&c[k])||k}

  if(pressedF(f,'k',6)){
    if(I.down&&fwdHeld)return'slide';
    if(I.up&&backHeld)return'flipkick';
    if(I.down)return'sweep';
    if(I.up)return'risekick';
    if(fwdHeld)return C.s1;
    if(backHeld)return'spinkick';

const JUMPHIT={kick:{dmg:12,lvl:'mid',range:1.6,hs:20,bs:14,push:.5,knock:'hard'},punch:{dmg:8,lvl:'mid',range:1.35,hs:18,bs:12,push:.3}};
function toOpp(f,o){const dx=o.x-f.x,dz=o.z-f.z,d=Math.hypot(dx,dz)||1e-4;return{ux:dx/d,uz:dz/d,d}}
function updateFighter(f,o,I){
  f.st++;
  const {ux,uz}=toOpp(f,o);
  const fwdHeld=!!I.fwd,backHeld=!!I.back;
  f.holdBack=backHeld||!!I.block;f.holdDown=!!I.down;f.blocking=!!I.block;
  const ground=!['air','jump','hop'].includes(f.state);
  if(ground){f.x+=f.vx*STEP;f.z+=f.vz*STEP;f.vx*=.82;f.vz*=.82}
  // auto-face the opponent unless committed to an attack
  if(!['attack','air','down','ko','win'].includes(f.state)){f.ax=ux;f.az=uz}
  switch(f.state){
    case'hit':case'block':if(--f.stun<=0)setState(f,'idle');break;
    case'air':case'jump':
      if(f.state==='jump'){
        // air attacks: any punch or kick while airborne; jump kick knocks down, jump punch is a quick poke
        if(!f.jatk){if(phase==='fight'){const k=['k','h'].find(k=>pressedF(f,k,6));
          if(k){f.jatk=1;f.jkind=k==='k'?'kick':'punch';f.jdone=false;f.moveId=++moveSeq;consume(f,k);sfx('whoosh');const u=toOpp(f,o);f.ax=u.ux;f.az=u.uz}}}
        else{f.jatk++;if(!f.jdone&&f.jatk>=4&&resolveHit(f,o,JUMPHIT[f.jkind],{home:false})!=='whiff')f.jdone=true}
      }
      f.y+=f.vy*STEP;f.vy-=18*STEP;f.x+=f.vx*STEP;f.z+=f.vz*STEP;
      if(f.y<=0&&f.vy<0){f.y=0;f.vy=0;f.vx*=.3;f.vz*=.3;
        if(f.state==='jump')setState(f,'idle');
        else{setState(f,f.hp<=0?'ko':'down');f.downT=44;R.shake=Math.max(R.shake,.06);sfx('land');if(f.hp<=0)sfx('ko')}}
      break;
    case'down':if(--f.downT<=0)setState(f,'getup');break;
    case'getup':if(f.st>=18)setState(f,'idle');break;
    case'dash':{
      // smooth burst: full speed at once, easing off over 16 frames; attacks can cancel it after frame 5
      const sp=9.5*Math.cos(Math.min(1,f.st/16)*Math.PI/2)+(fwdHeld?4.6*Math.min(1,f.st/16):0);
      f.x+=ux*sp*STEP;f.z+=uz*sp*STEP;
      if(f.st>=5&&phase==='fight'){const mv=pickMove(f,I,fwdHeld,backHeld);if(mv){startMove(f,mv,o);f.dashMomentum=true;break}}
      if(f.st>=16)setState(f,fwdHeld?'run':'idle');break;}
    case'hop':{
      // back hop: a quick low arc away from the opponent
      f.y+=f.vy*STEP;f.vy-=26*STEP;f.x-=ux*7.2*STEP*Math.max(.3,1-f.st/22);f.z-=uz*7.2*STEP*Math.max(.3,1-f.st/22);
      if(f.y<=0&&f.st>2){f.y=0;f.vy=0;setState(f,'idle');sfx('land')}break;}
    case'side':{
      // Tekken-style sidestep: a quick, front-loaded step around the opponent; attacks can cancel it after frame 6
      const sp=4.4*Math.max(0,1-f.st/16);f.x+=f.sx*sp*STEP;f.z+=f.sz*sp*STEP;
      if(f.st>=6&&phase==='fight'){const mv=pickMove(f,I,fwdHeld,backHeld);if(mv){startMove(f,mv,o);break}}
      if(f.st>=16)setState(f,'idle');break;}
    case'attack':{
      const m=MOVES[f.move];f.mf++;
      if(m.travel&&f.mf>=m.travel[0]&&f.mf<m.travel[1]){const sp=m.travel[2]*(1-(f.mf-m.travel[0])/(m.travel[1]-m.travel[0]))*.9+.4;f.x+=f.ax*sp*STEP;f.z+=f.az*sp*STEP}
      m.hits.forEach((h,i)=>{
        if(f.hitDone[i])return;const len=h.len||m.a;
        if(f.mf>=h.f&&f.mf<h.f+len){
          if(f.rageBlocked){f.hitDone[i]=true;return}
          const r=resolveHit(f,o,h,m);
          if(r!=='whiff')f.hitDone[i]=true;

    case'ko':case'win':break;
    default:{
      if(phase!=='fight'){if(f.state!=='idle')setState(f,'idle');break}
      const mv=pickMove(f,I,fwdHeld,backHeld);
      if(mv){startMove(f,mv,o);break}
      if(I.dashF){setState(f,'dash');f.vx=f.vz=0;sfx('dash');break}
      if(I.dashB){setState(f,'hop');f.vx=f.vz=0;f.vy=3.9;f.y=.01;sfx('dash');break}
      if(I.side){
        // "up" steps into the screen (away from the camera), "down" steps toward it
        let px=-uz,pz=ux;if(px*R.camFwd.x+pz*R.camFwd.z<0){px=-px;pz=-pz}
        const sg=I.side==='up'?1:-1;setState(f,'side');f.sx=px*sg;f.sz=pz*sg;sfx('whoosh');break}
      if(I.jump&&f.state!=='crouch'){setState(f,'jump');f.jatk=0;f.vy=7.2;sfx('whoosh');const j=(fwdHeld?1:backHeld?-1:0)*2.4;f.vx=ux*j;f.vz=uz*j;break}

      if(I.block){if(f.state!=='idle')setState(f,'idle');break}
      if(fwdHeld&&f.state==='run'){f.x+=ux*4.6*STEP;f.z+=uz*4.6*STEP}
      else if(fwdHeld){if(f.state!=='walkF')setState(f,'walkF');f.x+=ux*2.3*STEP;f.z+=uz*2.3*STEP}
      else if(backHeld){if(f.state!=='walkB')setState(f,'walkB');f.x-=ux*1.9*STEP;f.z-=uz*1.9*STEP}
      else if(f.state!=='idle')setState(f,'idle');
    }
  }
  if(!f.rage&&f.hp>0&&f.hp<=100){f.rage=true;sfx('rage');if(!f.isAI)banner(L('rageUnlocked'),'red sm',70)}

function resolveHit(att,def,h,m){

  // Linear moves travel straight down the attacker's locked aim, so a sidestep takes the target out of their path.
  // Homing moves (roundhouses, spinning kick, sweep, rage) sweep a wide arc and still connect.

  const defLowProfile=def.state==='crouch'||(def.state==='block'&&def.crouchBlock)||(def.state==='attack'&&MOVES[def.move].lowProfile);
  const airborne=def.state==='jump';
  if(h.lvl==='high'&&defLowProfile)return'whiff';
  if(h.lvl==='low'&&airborne)return'whiff';
  if(def.state==='hop'){if(h.lvl==='low')return'whiff';setState(def,'air')}
  const canBlock=['idle','walkB','crouch','block'].includes(def.state)&&def.holdBack;
  const mx=(att.x+def.x)/2+att.ax*.15,mz=(att.z+def.z)/2+att.az*.15,hy=h.lvl==='high'?1.5:h.lvl==='mid'?1.1:.35;
  if(canBlock){

    const blocked=h.lvl==='low'?crouchB:!crouchB;
    if(blocked){
      setState(def,'block');def.stun=h.bs;def.crouchBlock=crouchB;const pb=h.push*6+1.3;def.vx=att.ax*pb;def.vz=att.az*pb;att.vx=-att.ax*.9;att.vz=-att.az*.9;
      att.heat=Math.min(100,(att.heat||0)+3);def.heat=Math.min(100,(def.heat||0)+2);

    }
  }
  const juggle=def.state==='air';
  const counter=def.state==='attack'&&def.mf<=MOVES[def.move].s;
  let dmg=h.dmg*(att.rage?1.1:1)*(counter?1.2:1)*((CHARS[att.id]&&CHARS[att.id].dmgMul)||1)*((CHARS[def.id]&&CHARS[def.id].takeMul)||1);
  const wasHurt=['hit','air'].includes(def.state);
  att.combo=wasHurt?att.combo+1:1;
  if(juggle)dmg*=Math.max(.45,1-(att.combo-1)*.12);
  dmg=Math.max(1,Math.round(dmg));
  def.hp=Math.max(0,def.hp-dmg);
  att.heat=Math.min(100,(att.heat||0)+(MOVES[att.move]&&MOVES[att.move].isRage?0:dmg*1.6));def.heat=Math.min(100,(def.heat||0)+dmg*1.1);
  att.stats.dmg+=dmg;att.stats.hits++;att.stats.maxCombo=Math.max(att.stats.maxCombo,att.combo);att.comboShow=90;
  def.flash=1;
  const kb=v=>{def.vx=att.ax*v;def.vz=att.az*v};
  const armored=def.state==='attack'&&MOVES[def.move].armor&&def.mf<MOVES[def.move].armor&&def.hp>0;
  if(armored){}
  else if(juggle){def.vy=Math.max(def.vy,4.4);kb(1.3)}
  else if(h.launch){setState(def,'air');def.vy=7.4;kb(.9);def.y=Math.max(def.y,.02)}
  else if(h.knock){setState(def,'air');def.vy=h.knock==='trip'?3.2:4.8;kb(h.knock==='trip'?.8:3.2);def.y=Math.max(def.y,.02)}
  else{setState(def,'hit');def.stun=h.hs+(counter?8:0);def.hitLow=h.lvl==='low'||!!h.crumple;kb(h.crumple?.6:h.push*7+1.4)}
  if(def.hp<=0){

    if(phase==='fight'){phase='ko';phaseT=0;koWinner=att;slow(.3,9999);banner(L('ko'),'red',140)}
  }
  const heavy=h.dmg>=12||h.big;
  spark(mx+att.ax*.05,juggle?def.y+.9:hy,mz+att.az*.05,heavy?0xff7a2f:0xffe08a,heavy?18:11);
  sfx(h.snd||(heavy?'heavy':(MOVES[att.move]&&/kick|sweep|slide|kk|back/.test(att.move)?'kick':'hit')));hitstop=heavy?8:5;R.shake=Math.max(R.shake,heavy?.13:.06);
  if(counter&&def.hp>0)banner(L('counter'),'gold sm',40);
  return'hit';
}

/* ================= AI ================= */
function aiInput(f,o){
  const I={},D=DIFF[diff],d=toOpp(f,o).d;
  const hit=k=>{f.buf[{lp:'h',rp:'h',lk:'k',rk:'k'}[k]||k]=tick};
  if(phase!=='fight')return I;
  if(f.state==='attack'){
    if(f.move==='hook'&&f.mf===10&&f.connected&&Math.random()<.45+diff*.2)hit(Math.random()<.5?'h':'k');
    if(f.move==='onetwo'&&f.mf===10&&f.connected&&Math.random()<.45+diff*.15)hit(Math.random()<.65?'h':'k');
    if(f.move==='jab'&&f.mf===8&&Math.random()<.6+diff*.15)hit(Math.random()<.8?'h':'k');
    if(f.move==='highkick'&&f.mf===17&&f.connected&&Math.random()<.5+diff*.15)hit(Math.random()<.75?'k':'h');
    if(f.move==='kk2'&&f.mf===12&&f.connected&&Math.random()<.5+diff*.2)hit(Math.random()<.7?'k':'h');

    return I;
  }
  if(f.state==='side'){if(f.st===7&&d<1.3&&Math.random()<.5+diff*.2)hit(Math.random()<.5?'rp':'lk');return I}
  if(f.state==='jump'){if(!f.jatk&&d<1.6&&f.vy<2.5)hit(Math.random()<.7?'rk':'rp');return I}
  if(o.state==='jump'&&o.jatk&&o.jatk<5&&d<1.7&&free(f)&&Math.random()<D.block){I.back=true;return I}
  if(!free(f)&&f.state!=='block')return I;
  // defence: read the incoming move, then block (high/low) or sidestep a linear one
  if(o.state==='attack'&&o.mf<=MOVES[o.move].s+1){
    if(f.ai.seen!==o.moveId){
      f.ai.seen=o.moveId;f.ai.delay=D.react+Math.floor(Math.random()*6);
      const mv=MOVES[o.move],lvl=mv.hits[0].lvl;
      f.ai.blk=Math.random()<D.block;f.ai.low=lvl==='low'?Math.random()<D.lowRead:Math.random()<.08;
      f.ai.ss=!mv.home&&Math.random()<D.block*.35;
    }
    f.ai.delay--;
    if(f.ai.delay<=0&&d<1.6){
      if(f.ai.ss){f.ai.ss=false;f.ai.blk=false;I.side=Math.random()<.5?'up':'down';return I}
      if(f.ai.blk){I.back=true;if(f.ai.low)I.down=true;return I}
    }
  }else if(o.state==='attack'&&f.ai.blk&&d<1.6){I.back=true;if(f.ai.low)I.down=true;return I}
  if(o.state==='air'&&d<1.15&&o.y<1.4&&Math.random()<D.juggle*.25){hit(Math.random()<.5?'lp':'rp');return I}
  if(rageReady(f)&&d<1.05&&(o.state==='hit'||(o.state==='attack'&&o.mf>MOVES[o.move].s+MOVES[o.move].a))&&Math.random()<.25){hit('rage');return I}
  if(f.ai.retreat>0){f.ai.retreat--;I.back=true;return I}
  f.ai.cool--;
  if(d>1.12){I.fwd=true;if(d>2.6&&Math.random()<.01)I.dashF=true;return I}
  if(f.ai.cool<=0&&Math.random()<D.aggr*3){
    const r=Math.random();
    if(r<.26)hit('lp');else if(r<.38)hit('rp');else if(r<.5)hit('lk');else if(r<.64)hit('rk');
    else if(r<.74){I.fwd=true;hit('lk')}else if(r<.84){I.fwd=true;hit('rp')}else if(r<.87){I.back=true;hit('rk')}else if(r<.9){Math.random()<.5?(I.fwd=true,hit('rk')):(I.back=true,hit('rp'))}else if(r<.92){I.down=true;hit(Math.random()<.5?'k':'h')}else if(r<.96){I.up=true;hit(Math.random()<.5?'k':'h')}else{I.back=true;hit('h')}
    f.ai.cool=18+Math.random()*(40-diff*12);return I;
  }
  if(Math.random()<.008){I.side=Math.random()<.5?'up':'down';return I}
  if(d<2.4&&d>1.2&&Math.random()<.003+diff*.002){I.jump=true;I.fwd=true;return I}
  if(Math.random()<.012)f.ai.retreat=12+Math.random()*16;

    const a=Math.random()*Math.PI*2,v=1.5+Math.random()*3.5;s.v.set(Math.cos(a)*v,Math.sin(a)*v+1,(Math.random()-.5)*2.5)}
}
function slow(scale,frames){timeScale=reduced?Math.max(scale,.6):scale;slowT=frames}

/* ================= Rounds ================= */
function resetRound(){
  for(const[f,x]of[[p1,-1.5],[p2,1.5]]){
    const z0=ARENA.cz;
    Object.assign(f,{x,z:z0,y:0,vx:0,vz:0,vy:0,ax:x<0?1:-1,az:0,hp:MAXHP,trail:MAXHP,state:'idle',st:0,move:null,stun:0,combo:0,comboShow:0,rage:false,rageUsed:false,heat:0,flash:0,buf:{},dashReq:{}});
    f.yaw=Math.atan2(f.ax,f.az);f.cur={...(STANCE[f.id]||STANCE.billi).pose};
  }
  timer=99;timeScale=1;slowT=0;hitstop=0;koWinner=null;if(R){R.camN={x:0,z:1};R.camRight={x:1,z:0};R.camFwd={x:0,z:-1};R.mid.set(0,0,ARENA.cz)}
  phase='intro';phaseT=0;
}
function newMatch(){
  wins=[0,0];round=1;p1.stats={dmg:0,maxCombo:0,hits:0};
  resetRound();$('menu').hidden=true;$('endScr').hidden=true;$('pauseBtn').hidden=false;paused=false;
}
function endRound(winner){
  if(winner)wins[winner===p1?0:1]++;
  if(wins[0]>=2||wins[1]>=2){
    phase='end';$('pauseBtn').hidden=true;
    const won=wins[0]>=2;
    $('endTitle').textContent=L(won?'win':'lose');$('endTitle').style.color=won?'var(--hp)':'var(--rage)';
    const a=CHARS[p1.id].name[lang],b=CHARS[p2.id].name[lang];
    $('endSub').textContent=won?L('winSub').replace('{a}',a).replace('{b}',b).replace('{x}',wins[0]).replace('{y}',wins[1]):L('loseSub').replace('{a}',b).replace('{b}',a).replace('{x}',wins[1]).replace('{y}',wins[0]);
    $('stDmg').textContent=p1.stats.dmg;$('stCombo').textContent=p1.stats.maxCombo;$('stHits').textContent=p1.stats.hits;
    setTimeout(()=>{$('endScr').hidden=false;$('againBtn').focus()},400);
  }else{round++;resetRound()}
}
function phaseTick(){
  phaseT++;
  if(phase==='intro'){
    if(phaseT===1){banner(L('round')+' '+round,'',70);sfx('bell')}
    if(phaseT===75)banner(L('fight'),'gold',45);
    if(phaseT>=100)phase='fight';
  }else if(phase==='fight'){
    timer-=STEP;
    if(timer<=0){timer=0;phase='ko';phaseT=0;
      koWinner=p1.hp===p2.hp?null:(p1.hp>p2.hp?p1:p2);banner(L('timeUp'),'gold',100);sfx('bell')}
  }else if(phase==='ko'){
    const loser=koWinner===p1?p2:p1;
    if(timeScale<1&&(loser.state==='ko'||phaseT>200))slow(1,0);
    if(phaseT===150&&koWinner){setState(koWinner,'win');koWinner.ax=R.camN.x;koWinner.az=R.camN.z}
    if(phaseT===150&&!koWinner)banner(L('draw'),'',80);
    if(phaseT>=270)endRound(koWinner);
  }
}

/* ================= Main loop ================= */
function simTick(){
  tick++;
  if(slowT>0&&--slowT===0)timeScale=1;
  phaseTick();
  if(hitstop>0){hitstop--;return}
  const I1={};
  if(phase==='fight'){
    // map screen left/right onto toward/away from the opponent, based on where the camera sees them
    const u=toOpp(p1,p2),rightIsFwd=u.ux*R.camRight.x+u.uz*R.camRight.z>=0;
    const fk=rightIsFwd?'right':'left',bk=rightIsFwd?'left':'right';
    I1.fwd=pin.held[fk];I1.back=pin.held[bk];I1.down=pin.held.down;I1.up=pin.held.up;I1.block=pin.held.block;
    I1.dashF=tick-(pin.dash[fk]??-99)<3;I1.dashB=tick-(pin.dash[bk]??-99)<3;
    if(I1.dashF)pin.dash[fk]=-99;if(I1.dashB)pin.dash[bk]=-99;
    if(pin.side&&tick-pin.side.t<4){I1.side=pin.side.dir;pin.side=null}
    if(pin.held.up&&!pin.jumpUsed&&tick-(pin.buf.up??-99)>=9){I1.jump=true;pin.jumpUsed=true}
    if(tick-(pin.buf.jump??-99)<=6&&free(p1)){I1.jump=true;pin.buf.jump=-99}
    if((pin.held.up||pin.held.down)&&(pressedF(p1,'k',6)||pressedF(p1,'h',6))){pin.jumpUsed=true;pin.noSide=true}
  }
  p1.buf=pin.buf;
  const I2=aiInput(p2,p1);
  updateFighter(p1,p2,I1);updateFighter(p2,p1,I2);
  // push boxes (circles) and round arena edge
  const dx=p2.x-p1.x,dz=p2.z-p1.z,ad=Math.hypot(dx,dz)||1e-4;
  if(ad<.62&&![p1.state,p2.state].some(s=>s==='air'||s==='jump'||s==='hop')){const push=(.62-ad)/2;p1.x-=dx/ad*push;p1.z-=dz/ad*push;p2.x+=dx/ad*push;p2.z+=dz/ad*push}
  for(const f of[p1,p2]){f.x=Math.max(ARENA.x0,Math.min(ARENA.x1,f.x));f.z=Math.max(ARENA.z0,Math.min(ARENA.z1,f.z))}
  for(const[a,d]of[[p1,p2],[p2,p1]])if(!['hit','air','down'].includes(d.state)&&!(d.state==='block'))a.combo=0;
}

let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(R&&p1){
    if(!paused&&phase!=='menu'&&phase!=='end'&&phase!=='select'){acc+=dt*timeScale;let n=0;while(acc>=STEP&&n<6){simTick();acc-=STEP;n++}if(n>=6)acc=0}
    render(dt,now/1000);
  }
  requestAnimationFrame(frame);
}

const ARMS=['lShX','lShZ','lEl','rShX','rShZ','rEl'],pick=(o,ks)=>Object.fromEntries(ks.map(k=>[k,o[k]]));
function targetPose(f,t){
  const st=STANCE[f.id]||STANCE.billi,S=st.pose,sw=p=>p===GUARD?S:p;
  switch(f.state){
    case'walkF':case'walkB':{const ph=t*9*(f.state==='walkF'?1:-1),s=Math.sin(ph);return{...S,lShX:S.lShX+s*.12,rShX:S.rShX-s*.12,lEl:S.lEl-s*.15,rEl:S.rEl+s*.15,spY:S.spY+s*.06,lThX:S.lThX+s*.28,rThX:S.rThX-s*.28,lKn:S.lKn+Math.max(0,s)*.4,rKn:S.rKn+Math.max(0,-s)*.4,hipY:S.hipY-Math.abs(s)*.015}}
    case'crouch':return f.holdBack?(st.block?{...POSE.crouch,...pick(st.block,ARMS),hdX:.15}:POSE.cblock):POSE.crouch;
    case'block':return f.crouchBlock?(st.block?{...POSE.crouch,...pick(st.block,ARMS),hdX:.15}:POSE.cblock):(st.block||POSE.block);
    case'hit':return f.hitLow?POSE.hitLow:POSE.hit;
    case'air':return POSE.air;
    case'down':case'ko':return POSE.down;
    case'getup':return POSE.crouch;
    case'jump':{
      if(f.jatk)return f.jkind==='kick'
        ?G({lThX:-1.75,lKn:2.0,rThX:-1.5,rKn:.04,rThZ:.1,spX:-.3,spZ:.1,hdX:.1,lShZ:-1.0,rShZ:.9,lShX:-.4,rShX:.3,lEl:-.8,rEl:-.6,hipY:0,lunge:.15})
        :G({lThX:-1.05,lKn:1.8,rThX:-.7,rKn:1.4,rShX:-1.85,rShZ:.1,rEl:-.08,spX:.25,spY:-.5,lShX:-1.2,lEl:-2.2,hipY:0,lunge:.2});
      return POSE.jump}
    case'dash':{const k=Math.max(0,1-f.st/16);return{...S,lunge:.08,spX:S.spX+.25+.2*k,hdX:S.hdX-.15,hipY:S.hipY-.06,lShX:S.lShX+.5*k,rShX:S.rShX+.6*k,lEl:S.lEl+.6*k,rEl:S.rEl+.6*k,lThX:S.lThX-.35*k,rThX:S.rThX+.45*k,lKn:S.lKn+.3,rKn:S.rKn+.5*k}}
    case'run':{const ph=t*16,s=Math.sin(ph);return{...S,spX:S.spX+.3,hdX:S.hdX-.15,lunge:.06,hipY:S.hipY-.03-Math.abs(s)*.03,lThX:-.2-s*.8,rThX:-.2+s*.8,lKn:.4+Math.max(0,s)*1.1,rKn:.4+Math.max(0,-s)*1.1,lShX:S.lShX+s*.45,rShX:S.rShX-s*.45,lEl:-1.7,rEl:-1.7}}
    case'hop':{const k=Math.min(1,f.st/10);return{...S,rootRX:-.25*k,spX:S.spX-.2,hdX:S.hdX+.1,lThX:-1.0,lKn:1.6,rThX:-.5,rKn:1.2,hipY:0,lShZ:S.lShZ-.3,rShZ:S.rShZ+.3}}
    case'side':{const s=Math.sin(Math.min(1,f.st/16)*Math.PI);return{...S,hipY:S.hipY-s*.08,lThX:S.lThX-s*.25,rThX:S.rThX+s*.2,lKn:S.lKn+s*.35,spX:S.spX+.08}}
    case'win':return{...POSE.win,hipY:Math.sin(t*4)*.02};
    case'attack':{
      const ks=MOVES[f.move].keys,mf=f.mf;
      for(let i=ks.length-1;i>=0;i--){if(mf>=ks[i][0]){const nx=ks[i+1];if(!nx)return sw(ks[i][1]);return mixP(sw(ks[i][1]),sw(nx[1]),ease((mf-ks[i][0])/(nx[0]-ks[i][0])))}}
      return sw(ks[0][1]);
    }
    default:{
      if(f.blocking)return st.block||POSE.block;
      // idle: each fighter breathes in her own rhythm (bounce, side-to-side weave, or hopping on the toes)
      // fighting-game idle: rise slowly, drop fast (sells weight); the fists travel more than the
      // shoulders and the head stays steadier than the body, so the guard looks alive, not stiff
      const ph=t*st.freq+(f===p2?1.3:0),u=((ph/TAU)%1+1)%1,d=u<.6?(1-Math.cos(Math.PI*u/.6))/2:(1+Math.cos(Math.PI*(u-.6)/.4))/2;
      const w=Math.sin(ph*.5),a=st.arm||0,q=Math.sin(ph*.5+1.1);
      return{...S,hipY:S.hipY-d*st.amp,rootY:(1-d)*st.hop,lKn:S.lKn+d*(st.amp*4+st.hop*3),rKn:S.rKn+d*(st.amp*4+st.hop*3),
        spZ:S.spZ+w*st.weave,hdZ:S.hdZ-w*st.weave*.7,hipRZ:S.hipRZ+w*st.weave*.3,spX:S.spX+d*.05,hdX:S.hdX-d*.04,spY:S.spY+q*.05,
        lShX:S.lShX+d*a*.35+q*a*.4,rShX:S.rShX+d*a*.3-q*a*.35,lShZ:S.lShZ-d*a*.25,rShZ:S.rShZ+d*a*.25,
        lEl:S.lEl+d*a*1.2-q*a*.6,rEl:S.rEl+d*a*.9+q*a*.5}}
  }
}

// menu & select: slow cinematic orbit, framing the fighter in the half of the screen the panel leaves free
function showcaseCam(dt,t){
  const one=phase==='select'&&selStep===1,tx=one?p1.x:(p1.x+p2.x)/2,tz=p1.z;
  const a=Math.sin(t*.25)*.35,dist=one?3.1:3.9,mobile=innerWidth<=640;
  const cx=tx+Math.sin(a)*dist,cz=tz+Math.cos(a)*dist;
  const rx=Math.cos(a),rz=-Math.sin(a),shift=phase==='select'&&!mobile?(document.documentElement.dir==='rtl'?.75:-.75):0;
  R.cam.fov+=(36-R.cam.fov)*Math.min(1,dt*3);R.cam.updateProjectionMatrix();
  R.cam.position.set(cx+rx*shift,1.45,cz+rz*shift);R.cam.lookAt(tx+rx*shift,mobile&&phase==='select'?.55:1.0,tz+rz*shift);
  R.camN={x:Math.sin(a),z:Math.cos(a)};R.mid.set(tx,0,tz);
}
function render(dt,t){
  const T=R.T;
  $('app').classList.toggle('fighting',phase!=='menu'&&phase!=='select');
  for(const f of[p1,p2]){
    const tp=targetPose(f,t),k=reduced?1:1-Math.exp(-dt*(f.state==='attack'?40:16));
    if(f.state!=='attack'){for(const q of['spin','flip'])if(Math.abs(f.cur[q])>Math.PI)f.cur[q]-=Math.round(f.cur[q]/TAU)*TAU}
    for(const key of KEYS_P)f.cur[key]+=(tp[key]-f.cur[key])*k;
    // face the aim direction, turned slightly toward the camera for a 3/4 view
    const side=f.ax*R.camN.z-f.az*R.camN.x;let yawT=Math.atan2(f.ax,f.az)+(f.state==='win'?0:(side>0?-.3:.3));
    let dy=yawT-f.yaw;dy-=Math.round(dy/TAU)*TAU;f.yaw+=dy*Math.min(1,dt*14);
    f.rig.outer.position.set(f.x,f.y,f.z);f.rig.outer.rotation.y=f.yaw;
    applyPose(f.rig,f.cur,t);if(f.skin)driveSkin(f);if(f.rigged)driveRigged(f);
    f.flash=Math.max(0,f.flash-dt*5);
    for(const m of f.rig.mats)m.emissive.setRGB(f.flash*.5,f.flash*.12,f.flash*.05);
    f.rig.aura.intensity=f.rage&&f.state!=='ko'?1.6+Math.sin(t*8)*.6:0;
    f.trail+=(f.hp-f.trail)*Math.min(1,dt*2.2);
    if(f.comboShow>0)f.comboShow-=dt*60;
  }
  if(phase==='menu'||phase==='select')showcaseCam(dt,t);else{
  // camera: orbit so the line between the fighters stays across the screen (never flips sides abruptly)
  const mx=(p1.x+p2.x)/2,mz=(p1.z+p2.z)/2,lx=p2.x-p1.x,lz=p2.z-p1.z,sep=Math.hypot(lx,lz)||1e-4;
  let nx=-lz/sep,nz=lx/sep;if(nx*R.camN.x+nz*R.camN.z<0){nx=-nx;nz=-nz}
  R.mid.x+=(mx-R.mid.x)*Math.min(1,dt*5);R.mid.z+=(mz-R.mid.z)*Math.min(1,dt*5);
  const ragecam=[p1,p2].some(f=>f.state==='attack'&&MOVES[f.move].isRage&&f.move!=='rage');
  const dT=(ragecam?.72:1)*(6.2+sep*.6)+(R.cam.aspect<1?3.2/R.cam.aspect-1.6:0);R.camD+=(dT-R.camD)*Math.min(1,dt*3);
  // room the hall leaves behind the camera along a direction (ray from the fighters' midpoint to the camera bounds)
  const CB=ARENA.cam,room=(dx,dz)=>{let m=99;if(dx>1e-4)m=Math.min(m,(CB.x1-R.mid.x)/dx);if(dx<-1e-4)m=Math.min(m,(CB.x0-R.mid.x)/dx);
    if(dz>1e-4)m=Math.min(m,(CB.z1-R.mid.z)/dz);if(dz<-1e-4)m=Math.min(m,(CB.z0-R.mid.z)/dz);return Math.max(.5,m)};
  // ideal is perpendicular to the fighters; if a wall is too close there, swing up to 60deg toward open space
  let best=null;
  for(const off of[0,.2,-.2,.4,-.4,.6,-.6,.8,-.8,1.05,-1.05,1.3,-1.3]){const c=Math.cos(off),sn=Math.sin(off),dx=nx*c-nz*sn,dz=nx*sn+nz*c,r=room(dx,dz);
    const score=Math.min(r,R.camD)-Math.abs(off)*1.2;if(!best||score>best.score)best={dx,dz,score};if(r>=R.camD*.95)break}
  const kc=Math.min(1,dt*2.5);R.camN.x+=(best.dx-R.camN.x)*kc;R.camN.z+=(best.dz-R.camN.z)*kc;const nl=Math.hypot(R.camN.x,R.camN.z)||1;R.camN.x/=nl;R.camN.z/=nl;
  R.camFwd={x:-R.camN.x,z:-R.camN.z};R.camRight={x:R.camN.z,z:-R.camN.x};
  R.shake=Math.max(0,R.shake-dt*.6);const sh=reduced?0:R.shake;
  const D=Math.min(R.camD,room(R.camN.x,R.camN.z));
  const cx=R.mid.x+R.camN.x*D,cz=R.mid.z+R.camN.z*D;
  // if still squeezed, lift the camera and widen the lens a little instead of crowding the fighters
  const squeeze=Math.max(0,1-D/R.camD);R.camLift=(R.camLift||0)+(squeeze-(R.camLift||0))*Math.min(1,dt*3);
  // widen the lens just enough to keep both fighters in frame when the camera can't back away
  const halfW=Math.tan(Math.min(1.3,Math.atan((sep*.5+.9)/Math.max(.8,D)))),fitV=2*Math.atan(halfW/Math.max(.5,R.cam.aspect))*180/Math.PI;
  const fovT=Math.min(78,Math.max(34+R.camLift*8,fitV));R.cam.fov+=(fovT-R.cam.fov)*Math.min(1,dt*3);R.cam.updateProjectionMatrix();
  R.cam.position.set(cx+(Math.random()-.5)*sh,1.9+R.camLift*1.0+(Math.random()-.5)*sh,cz);
  R.cam.lookAt(R.mid.x,1.0,R.mid.z);
  }
  // see-through: scenery between the camera and either fighter is cut away in the factory shader
  XRAY.cam.value.copy(R.cam.position);XRAY.a.value.set(p1.x,1.0+p1.y,p1.z);XRAY.b.value.set(p2.x,1.0+p2.y,p2.z);
  R.key.position.set(R.mid.x+2.5,6,R.mid.z+4);R.key.target.position.set(R.mid.x,0,R.mid.z);
  // sparks
  for(const s of R.sparks){if(s.life<=0)continue;s.life-=dt*2.4;s.v.y-=9*dt;s.m.position.addScaledVector(s.v,dt);s.m.material.opacity=Math.max(0,s.life);s.m.scale.setScalar(.5+s.life);if(s.life<=0)s.m.visible=false}
  for(const r of R.rings){if(r.life<=0)continue;r.life-=dt*4;r.m.scale.setScalar(1+(1-r.life)*4);r.m.material.opacity=Math.max(0,r.life);r.m.lookAt(R.cam.position);if(r.life<=0)r.m.visible=false}
  if(!reduced){const pos=R.dust.geometry.attributes.position;for(let i=0;i<pos.count;i++){pos.setX(i,pos.getX(i)+Math.sin(t*.3+i)*dt*.08);pos.setY(i,pos.getY(i)+Math.cos(t*.4+i*1.7)*dt*.06)}pos.needsUpdate=true}
  const fl=R.fire();if(fl)fl.intensity=1.9+Math.sin(t*13)*.25+Math.sin(t*7.3)*.2;
  R.renderer.render(R.scene,R.cam);
  // HUD
  // two health layers: green (first 100) over yellow (last 100)
  for(const[f,i]of[[p1,1],[p2,2]]){const c=v=>Math.max(0,Math.min(100,v))+'%';
    $('hp'+i).style.width=c(f.hp);$('tr'+i).style.width=c(f.trail);$('hg'+i).style.width=c(f.hp-100);$('tg'+i).style.width=c(f.trail-100)}
  $('s1').classList.toggle('rage',p1.rage);$('s2').classList.toggle('rage',p2.rage);
  for(const[f,i]of[[p1,1],[p2,2]]){$('ht'+i).style.width=(rageReady(f)?100:0)+'%';$('hb'+i).classList.toggle('ready',rageReady(f))}
  document.querySelector('#bpad [data-k=rage]').classList.toggle('ready',rageReady(p1));
  const tm=Math.ceil(timer);$('timer').textContent=tm;$('timer').classList.toggle('low',tm<=10);
  [...$('w1').children].forEach((b,i)=>b.classList.toggle('on',wins[0]>i));
  [...$('w2').children].forEach((b,i)=>b.classList.toggle('on',wins[1]>i));
  for(const[f,id]of[[p1,'cb1'],[p2,'cb2']]){const el=$(id),show=f.comboShow>0&&f.stats&&f.combo>=2;
    if(f.combo>=2)el.innerHTML=`${f.combo}<span>${L('hits')}</span>`;el.classList.toggle('show',show)}
}

let lang='en';try{lang=localStorage.getItem('billi-lang')||'en'}catch(e){}
function L(k){return(STR[lang]&&STR[lang][k])??STR.ar[k]??k}
const K2=(a,b)=>`<kbd>${a}</kbd> ${L('or')} <kbd>${b}</kbd>`;
function helpRows(){
  const tag=l=>l?`<i class="tag ${LVL_TAG[l]}">${L(l)}</i>`:'';
  const ar=lang==='ar',H='<kbd>H</kbd>',K='<kbd>K</kbd>',Fw=L('fwd'),Bk=L('bk'),Up=L('up'),Dn=L('dn');
  const rows=[
    [ar?'ضربة يد (كل ضغطة غير)':'Punch (each press differs)',H,'high'],[ar?'ركلة دائرية':'Roundhouse',K,'mid'],
    [ar?'كومبو: ٤ ضربات يد وآخرها قوية':'Combo: four punches, power finish','H H H H','high'],[ar?'كومبو: ٣ يد وركلة تطيّره':'Combo: three punches, launch kick','H H H K','mid'],
    [ar?'كومبو رجل: ٣ ركلات وآخرها قاضية':'Kick combo: three kicks, big finish','K K K','high'],[ar?'ركلتين ثم ضربة الكومبو القوية':'Two kicks into the power finish','K K H','high'],[ar?'يد ثم ركلة منخفضة':'Punch into low kick','H K','low'],[ar?'يدين ثم ركلة تطيحه':'Two punches into knockdown kick','H H K','mid'],
    [ar?'أبركت يطيّر الخصم':'Launcher uppercut',`${Fw} + ${H}`,'mid'],[ar?'لكمة منخفضة':'Low punch',`${Dn} + ${H}`,'low'],[ar?'قبضة من فوق':'Overhead hammer',`${Up} + ${H}`,'mid'],
    [ar?'كنسة':'Sweep',`${Dn} + ${K}`,'low'],[ar?'ركلة صاعدة':'Rising kick',`${Up} + ${K}`,'mid'],[ar?'ركلة دوّارة':'Spinning kick',`${Bk} + ${K}`,'high'],
    [ar?'زحلقة':'Slide kick',`${Dn}+${Fw} + ${K}`,'low'],[ar?'شقلبة':'Flip kick',`${Up}+${Bk} + ${K}`,'mid'],
    [ar?'خاصة ١ (لكل مقاتل)':'Special 1 (per fighter)',`${Fw} + ${K}`,null],[ar?'خاصة ٢ (لكل مقاتل)':'Special 2 (per fighter)',`${Bk} + ${H}`,null],
    [ar?'صد':'Block','<kbd>P</kbd> '+(ar?'أو ورا':'or back'),null],[ar?'صد منخفض':'Low block',`<kbd>P</kbd> + ${Dn}`,null],
    [ar?'ضربة الغضب':'Rage Art',K2('O','L'),null],[ar?'سايد ستيب':'Sidestep',ar?'ضغطة سريعة فوق أو تحت':'Tap up or down',null],
    [ar?'نطة، وفي الهوا يد أو رجل':'Jump, then punch or kick in the air','<kbd>Space</kbd>',null],[ar?'اندفاع':'Dash',ar?'ضغطتين قدّام أو ورا':'Double-tap fwd or back',null],
    [ar?'حركة':'Move','<kbd>A</kbd><kbd>D</kbd><kbd>W</kbd><kbd>S</kbd> '+(ar?'أو الأسهم':'or arrows'),null]];
  $('movesList').innerHTML=rows.map(r=>`<div>${r[0]} <span>${r[1]}${tag(r[2])}</span></div>`).join('');
}
function keyLegend(full){
  const k=(key,lab)=>`<span class="k"><kbd>${key}</kbd><b>${L(lab)}</b></span>`;
  return k('H','kPunch')+k('K','kKick')+k('P','kBlock')+'<span class="sep"></span>'+k('Space','kJump')+k('O','kRage')+'<span class="sep"></span>'+k('← →','kMove')+k('↑ ↓','kSide')
    +`<span class="k"><b>H H H H · H H H K · K K K</b></span>`+(full?`<span class="k"><b>${L('kMouse')}</b></span>`:`<span class="k"><kbd>Tab</kbd>${L('kHide')}</span>`);
}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=L(el.dataset.i18n)});
  $('langBtn').textContent=$('langBtn2').textContent=lang==='ar'?'English':'عربي';
  $('pauseBtn').textContent=L(paused?'resume':'pause');
  $('keysHud').innerHTML=keyLegend(false);$('keysMenu').innerHTML=keyLegend(true);
  helpRows();if(p1){$('n1').textContent=CHARS[p1.id].name[lang];$('n2').textContent=CHARS[p2.id].name[lang]}
  if(phase==='select')renderSelect();
}
$('langBtn').onclick=$('langBtn2').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('billi-lang',lang)}catch(e){};applyLang()};

/* ================= Fighter swap + select screen ================= */
function setFighter(slot,id){
  const old=slot===1?p1:p2;
  if(old&&old.id===id)return;
  if(old){R.scene.remove(old.rig.outer);if(old.skin)R.scene.remove(old.skin.container);if(old.rigged)R.scene.remove(old.rigged.container)}
  const f=makeFighter(id,slot===2);
  if(slot===1)p1=f;else p2=f;
  if(SKINS[id]||id==='gent')f.rig.outer.traverse(m=>{if(m.isMesh)m.visible=false});
  if(SKINS[id]&&SKINS[id].src)attachSkin(f);
  if(id==='gent'&&GENT_SRC)attachRigged(f);
  Object.assign(f,{x:slot===1?-1.5:1.5,z:ARENA.cz,y:0,vx:0,vz:0,vy:0,ax:slot===1?1:-1,az:0,hp:MAXHP,trail:MAXHP,heat:0,dashReq:{}});f.cur={...(STANCE[id]||STANCE.billi).pose};f.yaw=Math.atan2(f.ax,f.az);
}
const ORDER=['billi','gent','pablo','son'];
let selStep=1,sel={1:'billi',2:'gent'};
function showcase(){
  // place fighters for the select screen: one in the spotlight on step 1, both facing off on step 2
  if(selStep===1){p1.x=0;p1.z=ARENA.cz;p1.ax=0;p1.az=1;p2.rig.outer.visible=false}
  else{p1.x=-.75;p1.z=ARENA.cz;p2.x=.75;p2.z=ARENA.cz;p1.ax=1;p1.az=0;p2.ax=-1;p2.az=0;p2.rig.outer.visible=true}
  for(const f of[p1,p2]){f.y=0;setState(f,'idle')}
}
function renderSelect(){
  const id=sel[selStep],c=CHARS[id];
  $('selStep').textContent=L(selStep===1?'step1':'step2');
  $('selTitle').textContent=L(selStep===1?'pick1':'pick2');
  $('roster').innerHTML='';
  ORDER.forEach(k=>{const ch=CHARS[k],b=document.createElement('button');b.className='card';b.type='button';b.id='card-'+k;b.setAttribute('aria-pressed',k===id);
    if(selStep===2&&k===sel[1])b.classList.add('taken');
    b.innerHTML=`<span class="swatch"><i style="background:linear-gradient(160deg,${ch.sw[1]} 0 34%,${ch.sw[2]} 34% 52%,${ch.sw[0]} 52%)"></i></span><b>${ch.name[lang]}</b>${ch.main?`<small class="crown">${L('main')}</small>`:''}`;
    b.onclick=()=>{sel[selStep]=k;setFighter(selStep,k);showcase();renderSelect()};$('roster').appendChild(b)});
  $('dName').textContent=c.name[lang];$('dStyle').textContent=c.style[lang];$('dStance').textContent=c.stance[lang];
  const sp=(mv,inp)=>`<div><em>${MOVE_NAMES[mv][lang]}</em><span>${inp} <i class="tag ${LVL_TAG[MOVES[mv].hits[MOVES[mv].hits.length-1].lvl]}">${L(MOVES[mv].hits[MOVES[mv].hits.length-1].lvl)}</i></span></div>`;
  $('dSpecials').innerHTML=`<div class="lbl" style="border:0;padding:0">${L('specials')}</div>`+sp(c.s1,`${L('fwd')} + <kbd>K</kbd>`)+sp(c.s2,`${L('bk')} + <kbd>H</kbd>`)+(c.power?sp(c.power,'H H H H'):'')+(c.launch?sp(c.launch,'H H H K'):'')+sp(c.kfin||'kfin','K K K')+(c.rage?sp(c.rage,'<kbd>O</kbd>'):'');
  $('diffWrap').hidden=selStep!==2;$('selRandom').hidden=selStep!==2;
  $('selOk').textContent=L(selStep===1?'next':'fightBtn');
}
function openSelect(){
  phase='select';selStep=1;$('menu').hidden=true;$('endScr').hidden=true;$('select').hidden=false;$('pauseBtn').hidden=true;
  showcase();renderSelect();
}
$('selOk').onclick=()=>{
  if(selStep===1){selStep=2;showcase();renderSelect();return}
  $('select').hidden=true;p2.rig.outer.visible=true;
  $('n1').textContent=CHARS[p1.id].name[lang];$('n2').textContent=CHARS[p2.id].name[lang];
  initAudio();newMatch();
};
$('selBack').onclick=()=>{if(selStep===2){selStep=1;showcase();renderSelect()}else{$('select').hidden=true;$('menu').hidden=false;phase='menu';p2.rig.outer.visible=true}};
$('selRandom').onclick=()=>{const k=ORDER[Math.floor(Math.random()*ORDER.length)];sel[2]=k;setFighter(2,k);showcase();renderSelect()};

function togglePause(){
  paused=!paused;$('pauseBtn').textContent=L(paused?'resume':'pause');
  if(paused){banner(L('pause'),'',1e7);ac&&ac.suspend()}else{$('banner').innerHTML='';ac&&ac.resume();last=performance.now()}
}
$('pauseBtn').onclick=togglePause;
document.querySelectorAll('#diff button').forEach(b=>b.onclick=()=>{diff=+b.dataset.d;document.querySelectorAll('#diff button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
$('startBtn').onclick=()=>{initAudio();openSelect()};
$('againBtn').onclick=()=>{initAudio();newMatch()};
$('menuBtn').onclick=()=>{openSelect()};

/* ================= Boot ================= */
if(init3D()){
  resize();
  setFighter(1,'billi');setFighter(2,'gent');loadSkins();loadGent();
  resetRound();phase='menu';applyLang();
  requestAnimationFrame(frame);
}else{
  $('menu').querySelector('.panel').innerHTML='<h1 dir="ltr">Billi <em>Fighter</em></h1><p class="sub">'+(lang==='ar'?'المتصفح هذا ما يدعم الرسوم ثلاثية الأبعاد (WebGL). جرّب من متصفح ثاني مثل كروم أو سفاري.':'This browser does not support 3D graphics (WebGL). Try Chrome or Safari.')+'</p>';
}
})();
</script>
